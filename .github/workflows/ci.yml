name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Update Homebrew
        run: |
          brew update
          brew --version

      - name: Tap this checkout
        run: brew tap wesleyel/tap "$GITHUB_WORKSPACE"

      - name: List changed formulae and casks
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # PR: files changed against the base branch. Push (a release workflow
          # committing a formula/cask, or a manual commit): files in this push.
          # Fallback when the previous commit is unknown: everything.
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags origin "$BASE_REF"
            files=$(git diff --name-only --diff-filter=d "origin/$BASE_REF"...HEAD)
          elif [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=d "$BEFORE" HEAD)
          else
            files=$(git ls-files 'Formula/*.rb' 'Casks/*.rb')
          fi
          formulae=""
          casks=""
          for f in $files; do
            case "$f" in
              Formula/*.rb) formulae="$formulae $(basename "$f" .rb)" ;;
              Casks/*.rb)   casks="$casks $(basename "$f" .rb)" ;;
            esac
          done
          formulae=${formulae# }
          casks=${casks# }
          echo "formulae=$formulae" >> "$GITHUB_OUTPUT"
          echo "casks=$casks" >> "$GITHUB_OUTPUT"
          echo "formulae: ${formulae:-none}"
          echo "casks: ${casks:-none}"

      - name: brew style
        run: brew style "$GITHUB_WORKSPACE/Formula" "$GITHUB_WORKSPACE/Casks"

      - name: Audit and test formulae
        if: steps.changed.outputs.formulae != ''
        env:
          FORMULAE: ${{ steps.changed.outputs.formulae }}
        run: |
          set -euo pipefail
          for name in $FORMULAE; do
            brew audit --strict --online "wesleyel/tap/${name}"
            brew install "wesleyel/tap/${name}"
            brew test "wesleyel/tap/${name}"
          done

      - name: Audit casks
        if: steps.changed.outputs.casks != ''
        env:
          CASKS: ${{ steps.changed.outputs.casks }}
        run: |
          set -euo pipefail
          for name in $CASKS; do
            brew audit --cask "wesleyel/tap/${name}"
          done
